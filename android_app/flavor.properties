# APK flavor token — the content line this checkout builds. See BRANCHES.md.
#
# Read by build_android.ps1, which puts it in the dist/ filename and bakes it
# into the binary as HL5_FLAVOR (`-Flavor` wins over this file).
#
#   empty          -> hero5-v<name>-vc<code>.apk           (main, all content)
#   flavor=vanilla -> hero5-vanilla-v<name>-vc<code>.apk   (no (진) weapons)
#
# ASCII letters and digits only. `main` leaves this empty; the `vanilla`
# branch is the ONLY place this says `vanilla`.
flavor=
